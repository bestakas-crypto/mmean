<!-- [Directory] MME/templates -->
<!-- [File] prompt_board.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MMEAN Prompt Board</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f172a;
      --panel:   #111827;
      --border:  #1f2937;
      --border2: #334155;
      --text:    #e5e7eb;
      --muted:   #94a3b8;
      --accent:  #38bdf8;
      --green:   #22c55e;
      --yellow:  #f59e0b;
      --red:     #ef4444;
      --purple:  #a78bfa;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: #0a1628;
      border-bottom: 1px solid var(--border);
    }
    .topbar h1 { font-size: 18px; color: var(--accent); }
    .topbar a  { color: var(--muted); font-size: 13px; text-decoration: none; }
    .topbar a:hover { color: var(--text); }
    .reload-badge {
      margin-left: auto;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #1e293b;
      color: var(--yellow);
      border: 1px solid #334155;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px 1fr 260px;
      gap: 0;
      height: calc(100vh - 50px);
    }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 16px 0;
      overflow-y: auto;
    }
    .sidebar-label {
      font-size: 11px;
      color: var(--muted);
      padding: 0 14px 8px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .prompt-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      border-left: 3px solid transparent;
      transition: all .15s;
    }
    .prompt-btn:hover  { background: #1e293b; color: var(--text); }
    .prompt-btn.active {
      background: #1e293b;
      color: var(--accent);
      border-left-color: var(--accent);
    }
    .group-label {
      font-size: 11px;
      color: var(--muted);
      padding: 14px 14px 4px;
      border-top: 1px solid var(--border);
      letter-spacing: .05em;
    }

    .source-badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 6px;
      vertical-align: middle;
    }
    /* 현재 유효 source badge는 file/default/hardcode만 사용 */
    .src-file     { background: #064e3b; color: #6ee7b7; }
    .src-default  { background: #1e3a5f; color: #93c5fd; }
    .src-hardcode { background: #3b1f1f; color: #fca5a5; }
    .src-mixed    { background: #3b2e0a; color: #fde68a; }

    /* history action badge */
    .src-action-board   { background: #2d1b5e; color: #c4b5fd; }
    .src-action-reset   { background: #3b2e0a; color: #fde68a; }
    .src-action-restore { background: #1f3b2e; color: #86efac; }
    .src-action-file    { background: #334155; color: #e2e8f0; }

    .editor-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }
    .editor-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .editor-toolbar .prompt-title {
      font-size: 15px;
      font-weight: bold;
      color: var(--text);
    }
    .editor-toolbar .hash-text {
      font-size: 11px;
      color: var(--muted);
      font-family: monospace;
    }
    .editor-toolbar .spacer { flex: 1; }

    textarea#editor {
      flex: 1;
      width: 100%;
      background: var(--panel);
      color: var(--text);
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 16px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.7;
      resize: none;
      outline: none;
    }
    .editor-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--panel);
    }
    .note-input {
      flex: 1;
      background: #1e293b;
      border: 1px solid var(--border2);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 10px;
      font-size: 13px;
    }
    .note-input::placeholder { color: var(--muted); }

    .btn {
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid var(--border2);
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-save    { background: var(--green);  color: #000; border-color: var(--green); }
    .btn-reset   { background: var(--yellow); color: #000; border-color: var(--yellow); }
    .btn-preview { background: #1e293b; color: var(--text); }
    .btn-restore { background: var(--purple); color: #000; border-color: var(--purple); font-size: 12px; padding: 4px 8px; }

    .right-panel {
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .right-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .rtab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      border-bottom: 2px solid transparent;
    }
    .rtab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .right-body { flex: 1; overflow-y: auto; padding: 12px; }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      gap: 10px;
    }
    .info-row .label { color: var(--muted); }
    .info-row .val   { font-family: monospace; color: var(--text); text-align: right; }

    .history-item {
      padding: 8px;
      margin-bottom: 6px;
      background: #1e293b;
      border-radius: 6px;
      font-size: 12px;
      border: 1px solid var(--border);
    }
    .history-item .hi-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      gap: 8px;
    }
    .history-item .hi-ts   { color: var(--muted); }
    .history-item .hi-hash { font-family: monospace; color: var(--accent); }
    .history-item .hi-note { color: var(--muted); font-style: italic; margin-top: 3px; }
    .history-item .hi-src  { font-size: 10px; display: inline-block; padding: 2px 6px; border-radius: 4px; }

    #preview-modal {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #preview-modal.open { display: flex; }
    .preview-box {
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: 10px;
      max-width: 700px;
      width: 90%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 12px;
    }
    .preview-box h3 { color: var(--accent); }
    .preview-box pre {
      flex: 1;
      overflow-y: auto;
      background: #0a1628;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: var(--text);
    }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      opacity: 0;
      transition: opacity .3s;
      z-index: 200;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }
    #toast.ok   { background: var(--green); color: #000; }
    #toast.err  { background: var(--red);   color: #fff; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>MMEAN Prompt Board</h1>
  <a href="/">대시보드</a>
  <a href="/analytics">Analytics</a>
  <div class="reload-badge" id="reloadBadge">reload: ...</div>
</div>

<div class="layout">

  <div class="sidebar">
    <div class="sidebar-label">전략 (장전)</div>
    <button class="prompt-btn active" data-name="strategy_system"
            onclick="selectPrompt('strategy_system')">
      System <span class="source-badge" id="badge_strategy_system"></span>
    </button>
    <button class="prompt-btn" data-name="strategy_user_suffix"
            onclick="selectPrompt('strategy_user_suffix')">
      User Suffix <span class="source-badge" id="badge_strategy_user_suffix"></span>
    </button>

    <div class="group-label">기회 필터 (장중)</div>
    <button class="prompt-btn" data-name="opportunity_system"
            onclick="selectPrompt('opportunity_system')">
      System <span class="source-badge" id="badge_opportunity_system"></span>
    </button>
    <button class="prompt-btn" data-name="opportunity_user_suffix"
            onclick="selectPrompt('opportunity_user_suffix')">
      User Suffix <span class="source-badge" id="badge_opportunity_user_suffix"></span>
    </button>
  </div>

  <div class="editor-panel">
    <div class="editor-toolbar">
      <span class="prompt-title" id="editorTitle">strategy_system</span>
      <span class="hash-text" id="editorHash">#--------</span>
      <div class="spacer"></div>
      <button class="btn btn-preview" onclick="openPreview()">미리보기</button>
      <button class="btn btn-reset" onclick="resetPrompt()">기본값 복원</button>
      <button class="btn btn-save" onclick="savePrompt()">저장</button>
    </div>

    <textarea id="editor" placeholder="프롬프트를 입력하세요..."></textarea>

    <div class="editor-footer">
      <input class="note-input" id="noteInput"
             placeholder="변경 메모 (선택사항, 이력에 기록됩니다)" />
    </div>
  </div>

  <div class="right-panel">
    <div class="right-tabs">
      <button class="rtab active" onclick="switchTab('info')">정보</button>
      <button class="rtab" onclick="switchTab('history')">이력</button>
    </div>
    <div class="right-body" id="rightBody">
      <div id="tabInfo">
        <div class="info-row">
          <span class="label">이름</span>
          <span class="val" id="iName">-</span>
        </div>
        <div class="info-row">
          <span class="label">Hash</span>
          <span class="val" id="iHash">-</span>
        </div>
        <div class="info-row">
          <span class="label">현재 Source</span>
          <span class="val" id="iSource">-</span>
        </div>
        <div class="info-row">
          <span class="label">파일 경로</span>
          <span class="val" style="font-size:11px;word-break:break-all" id="iPath">-</span>
        </div>
        <div class="info-row">
          <span class="label">파일 존재</span>
          <span class="val" id="iExists">-</span>
        </div>
        <div style="margin-top:16px">
          <div class="sidebar-label">Combined 미리보기</div>
          <div class="info-row">
            <span class="label">Strategy hash</span>
            <span class="val" id="iStrategyHash" style="font-size:11px">-</span>
          </div>
          <div class="info-row">
            <span class="label">Opportunity hash</span>
            <span class="val" id="iOpportunityHash" style="font-size:11px">-</span>
          </div>
        </div>
      </div>

      <div id="tabHistory" style="display:none">
        <div id="historyList"><span style="color:var(--muted)">이력 로딩중...</span></div>
      </div>
    </div>
  </div>

</div>

<div id="preview-modal">
  <div class="preview-box">
    <h3 id="previewTitle">미리보기</h3>
    <pre id="previewContent"></pre>
    <button class="btn" onclick="closePreview()" style="align-self:flex-end">닫기</button>
  </div>
</div>

<div id="toast"></div>

<script>
  let currentName = "strategy_system";
  let allInfo = {};
  let currentTab = "info";

  async function init() {
    await loadAllInfo();
    await selectPrompt("strategy_system");
    await loadReloadMode();
  }

  async function loadReloadMode() {
    try {
      const r = await fetch("/api/prompts");
      const d = await r.json();
      document.getElementById("reloadBadge").textContent =
        "reload: " + (d.reload_mode || "?");
    } catch(e) {}
  }

  async function loadAllInfo() {
    try {
      const r = await fetch("/api/prompts");
      const d = await r.json();
      allInfo = d.prompts || {};
      for (const name of Object.keys(allInfo)) {
        updateBadge(name, allInfo[name].source);
      }
      if (d.combined) {
        document.getElementById("iStrategyHash").textContent =
          d.combined.strategy?.hash || "-";
        document.getElementById("iOpportunityHash").textContent =
          d.combined.opportunity?.hash || "-";
      }
    } catch(e) {
      console.error(e);
    }
  }

  function normalizeSource(source) {
    if (!source) return "?";
    if (String(source).startsWith("mixed(")) return "mixed";
    if (["file", "default", "hardcode"].includes(source)) return source;
    return "file";
  }

  function badgeClassForSource(source) {
    const normalized = normalizeSource(source);
    return {
      file: "src-file",
      default: "src-default",
      hardcode: "src-hardcode",
      mixed: "src-mixed",
    }[normalized] || "src-default";
  }

  function updateBadge(name, source) {
    const el = document.getElementById("badge_" + name);
    if (!el) return;
    const normalized = normalizeSource(source);
    el.className = "source-badge " + badgeClassForSource(source);
    el.textContent = normalized;
  }

  function historyClassForAction(action) {
    return {
      board: "src-action-board",
      reset: "src-action-reset",
      restore: "src-action-restore",
      file: "src-action-file",
    }[action] || "src-action-file";
  }

  async function selectPrompt(name) {
    currentName = name;
    document.querySelectorAll(".prompt-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.name === name);
    });
    document.getElementById("editorTitle").textContent = name;

    try {
      const r = await fetch(`/api/prompts/${name}`);
      const d = await r.json();

      document.getElementById("editor").value = d.content || "";
      document.getElementById("editorHash").textContent = "#" + (d.hash || "?");
      document.getElementById("iName").textContent = d.name || name;
      document.getElementById("iHash").textContent = d.hash || "-";
      document.getElementById("iSource").textContent = normalizeSource(d.source || "-");
      document.getElementById("iPath").textContent = d.path || "-";
      document.getElementById("iExists").textContent =
        d.exists ? "✅ 있음" : "⚠ 없음 (폴백 중)";
      document.getElementById("noteInput").value = "";
      updateBadge(name, d.source);
    } catch(e) {
      toast("로드 실패: " + e, "err");
    }

    if (currentTab === "history") {
      await loadHistory();
    }
  }

  async function savePrompt() {
    const content = document.getElementById("editor").value.trim();
    const note    = document.getElementById("noteInput").value.trim();
    if (!content) {
      toast("내용이 비어 있습니다", "err");
      return;
    }

    try {
      const r = await fetch(`/api/prompts/${currentName}`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({content, note})
      });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || "저장 실패");

      document.getElementById("editorHash").textContent = "#" + (d.hash || "?");
      document.getElementById("iHash").textContent = d.hash || "-";
      document.getElementById("iSource").textContent = normalizeSource(d.source || "-");
      document.getElementById("iPath").textContent = d.path || "-";
      document.getElementById("iExists").textContent = d.exists ? "✅ 있음" : "⚠ 없음 (폴백 중)";
      updateBadge(currentName, d.source);

      await loadAllInfo();
      if (currentTab === "history") await loadHistory();

      toast("저장 완료", "ok");
    } catch(e) {
      toast("저장 실패: " + e.message, "err");
    }
  }

  async function resetPrompt() {
    if (!confirm("기본값으로 복원할까요?")) return;

    try {
      const r = await fetch(`/api/prompts/${currentName}/reset`, {method: "POST"});
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || "복원 실패");

      document.getElementById("editor").value = d.content || "";
      document.getElementById("editorHash").textContent = "#" + (d.hash || "?");
      document.getElementById("iHash").textContent = d.hash || "-";
      document.getElementById("iSource").textContent = normalizeSource(d.source || "-");
      document.getElementById("iPath").textContent = d.path || "-";
      document.getElementById("iExists").textContent = d.exists ? "✅ 있음" : "⚠ 없음 (폴백 중)";
      document.getElementById("noteInput").value = "";
      updateBadge(currentName, d.source);

      await loadAllInfo();
      if (currentTab === "history") await loadHistory();

      toast("기본값 복원 완료", "ok");
    } catch(e) {
      toast("복원 실패: " + e.message, "err");
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".rtab").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".rtab")[tab === "info" ? 0 : 1].classList.add("active");

    document.getElementById("tabInfo").style.display = (tab === "info") ? "" : "none";
    document.getElementById("tabHistory").style.display = (tab === "history") ? "" : "none";

    if (tab === "history") loadHistory();
  }

  async function loadHistory() {
    try {
      const r = await fetch(`/api/prompts/${currentName}/history?limit=20`);
      const d = await r.json();
      const arr = d.history || [];
      const box = document.getElementById("historyList");

      if (!arr.length) {
        box.innerHTML = `<span style="color:var(--muted)">이력 없음</span>`;
        return;
      }

      box.innerHTML = arr.map(h => `
        <div class="history-item">
          <div class="hi-top">
            <span class="hi-ts">${h.ts || "-"}</span>
            <span class="hi-hash">#${h.prompt_hash || "-"}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <span class="hi-src ${historyClassForAction(h.source_type)}">${h.source_type || "-"}</span>
            <button class="btn btn-restore" onclick="restoreVersion(${h.id})">복원</button>
          </div>
          ${h.note ? `<div class="hi-note">${escapeHtml(h.note)}</div>` : ""}
        </div>
      `).join("");
    } catch(e) {
      document.getElementById("historyList").innerHTML =
        `<span style="color:var(--red)">이력 로드 실패</span>`;
    }
  }

  async function restoreVersion(id) {
    if (!confirm(`#${id} 버전으로 복원할까요?`)) return;

    try {
      const r = await fetch(`/api/prompts/${currentName}/restore/${id}`, {method: "POST"});
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || "복원 실패");

      await selectPrompt(currentName);
      await loadAllInfo();
      if (currentTab === "history") await loadHistory();

      toast("버전 복원 완료", "ok");
    } catch(e) {
      toast("복원 실패: " + e.message, "err");
    }
  }

  function openPreview() {
    document.getElementById("previewTitle").textContent = currentName + " 미리보기";
    document.getElementById("previewContent").textContent =
      document.getElementById("editor").value || "";
    document.getElementById("preview-modal").classList.add("open");
  }

  function closePreview() {
    document.getElementById("preview-modal").classList.remove("open");
  }

  function toast(msg, type="ok") {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = `${type} show`;
    setTimeout(() => { el.className = ""; }, 1800);
  }

  function escapeHtml(s) {
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  init();
</script>
</body>
</html>
